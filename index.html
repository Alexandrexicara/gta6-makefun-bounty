<style>
:root{--pink:#ff4f9a;--gold:#ffd34e;--purple:#28104c;--ink:#100b25}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:30px 22px;background:radial-gradient(ellipse at 50% -12%,#74406f 0,#24163f 42%,#090b18 100%);font-family:Inter,Arial,Helvetica,sans-serif;color:#fff;display:grid;place-items:center}
main{width:min(1180px,100%)}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:0 0 20px;padding:0 4px}
.brand{font-weight:1000;letter-spacing:3px;font-size:14px}.brand b{color:#7fffee}
.pill{border:1px solid #ffffff35;background:#ffffff0b;border-radius:30px;padding:10px 16px;color:#f6d5ec;font-size:10px;font-weight:800;letter-spacing:2px}
.frame{overflow:hidden;border:1px solid #ffffff40;border-radius:24px;box-shadow:0 32px 100px #000b,0 0 55px #ff4f9a18;background:#170c32}
.art{width:100%;height:auto;display:block}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.actions button{border:0;border-radius:13px;padding:15px 22px;background:linear-gradient(110deg,#ffe16b,#ff7da7);color:#1b0c2b;font-weight:1000;letter-spacing:.07em;cursor:pointer;box-shadow:0 5px 0 #8b315f,0 12px 28px #0005;transition:transform .18s,filter .18s}
.actions button:hover{transform:translateY(-2px);filter:brightness(1.08)}
.actions .secondary{background:#ffffff10;color:#fff;border:1px solid #ffffff45;box-shadow:none}
.note{color:#c9bddb;font-size:12px;line-height:1.6;margin:17px 3px 0}
@media(max-width:650px){body{padding:15px 12px}header{align-items:flex-start;flex-direction:column;margin-bottom:14px}.frame{border-radius:15px}.actions{display:grid;grid-template-columns:1fr}.actions button{width:100%}}
</style></head>

</main>
<script>
const caption="Donald Trump já separou o dinheiro… agora só falta JOGAR GTA 😂🎮 @makefunai #GTA6 #makefun";
document.getElementById("copy").onclick=async()=>{try{await navigator.clipboard.writeText(caption);document.getElementById("copy").textContent="LEGENDA COPIADA ✓";setTimeout(()=>document.getElementById("copy").textContent="COPIAR LEGENDA PARA O X",1800)}catch{alert(caption)}};
document.getElementById("download").onclick=()=>{const svg=document.getElementById("art"),src=new XMLSerializer().serializeToString(svg),url=URL.createObjectURL(new Blob([src],{type:"image/svg+xml;charset=utf-8"})),img=new Image();img.onload=()=>{const c=document.createElement("canvas");c.width=2400;c.height=1350;c.getContext("2d").drawImage(img,0,0,2400,1350);URL.revokeObjectURL(url);c.toBlob(blob=>{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="makefun-gta6-jogar-gta-meme.png";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)},"image/png")};img.onerror=()=>{URL.revokeObjectURL(url);alert("Falha ao exportar o meme.")};img.src=url};
