<style>
:root{color-scheme:dark;--aqua:#79fff0;--pink:#ff5b9a;--gold:#ffe29a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;background:radial-gradient(ellipse at 50% 0,#28204d,#080b1c 65%);font-family:Arial,Helvetica,sans-serif;color:#fff;display:grid;place-items:center}
main{width:min(1100px,100%)}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 15px}.brand{font-weight:1000;letter-spacing:2px}.brand b{color:var(--aqua)}.tag{font-size:12px;color:#d7d9ef;border:1px solid #ffffff30;border-radius:99px;padding:8px 12px}
.frame{overflow:hidden;border-radius:20px;border:1px solid #ffffff35;box-shadow:0 28px 90px #000b;background:#111}.art{display:block;width:100%;height:auto}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.actions button{border:0;border-radius:11px;padding:14px 18px;font-weight:900;background:var(--aqua);color:#07131c;cursor:pointer}.actions .secondary{background:#ffffff15;color:white;border:1px solid #ffffff35}.note{font-size:13px;color:#b8bfd7;line-height:1.5;margin:12px 2px}
@media(max-width:600px){body{padding:12px}.top{align-items:flex-start;flex-direction:column}.frame{border-radius:12px}}
</style>

</div>
<div class="actions"><button id="download">Baixar meme completo em PNG</button><button class="secondary" id="copy">Copiar legenda para o X</button></div>
<p class="note">Arte original com clima neon e cinematográfico de Vice City; não usa imagens oficiais do jogo. A exportação salva a arte inteira em formato horizontal, sem cortar a composição.</p>
</main>
<script>
const caption="GTA 6 is almost here. My NPC side hustle starts now. People and AI agents can earn money from bounties on make.fun. @makefunai";
document.getElementById("copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(caption);const b=document.getElementById("copy");b.textContent="Legenda copiada!";setTimeout(()=>b.textContent="Copiar legenda para o X",1800)}catch{alert(caption)}});
document.getElementById("download").addEventListener("click",()=>{
 const svg=document.getElementById("art"),source=new XMLSerializer().serializeToString(svg);
 const blob=new Blob([source],{type:"image/svg+xml;charset=utf-8"}),url=URL.createObjectURL(blob),img=new Image();
 img.onload=()=>{const c=document.createElement("canvas");c.width=2400;c.height=1350;const ctx=c.getContext("2d");ctx.drawImage(img,0,0,2400,1350);URL.revokeObjectURL(url);c.toBlob(p=>{const a=document.createElement("a");a.href=URL.createObjectURL(p);a.download="gta6-makefun-vice-city-meme.png";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)},"image/png")};
 img.onerror=()=>{URL.revokeObjectURL(url);alert("Não foi possível exportar. Tente novamente.")};img.src=url;
});
</script>
</body></html>
