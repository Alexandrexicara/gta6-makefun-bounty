.actions button:hover{transform:translateY(-2px);filter:brightness(1.08)}
.actions .secondary{background:#ffffff10;color:#fff;border:1px solid #ffffff45;box-shadow:none}
.note{color:#c9bddb;font-size:12px;line-height:1.6;margin:17px 3px 0}
